<title>Satzlehre Übungen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Display:wght@600;700&family=Wix+Madefor+Text:wght@400;600;700&display=swap">
<style>
/* Layout: a mobile-first learning app in one centred column (max 760px): greeting header,
   pastel exercise tiles, white cards on a pale ground, bottom tab bar.
   Ink is one navy at three strengths; blue is the single accent (main action, active tab, your notes).
   Spacing scale 4/8/12/16/24/32. Radius scale 10 (controls) / 16 (cards) / 999 (pills). */
:root {
  --bg: #f4f6f9;
  --sheet: #ffffff;
  --soft: #eaeef4;
  --rule: #dfe4ec;
  --ink: rgb(6, 28, 82);
  --ink-2: rgba(6, 28, 82, .66);
  --ink-3: rgba(6, 28, 82, .42);
  --muted: rgba(6, 28, 82, .66);
  --accent: #1f5bd6;
  --accent-strong: #1747a8;
  --accent-ink: #ffffff;
  --accent-soft: #e7eefc;
  --ok: #157a4a;
  --ok-soft: #e1f3ea;
  --bad: #c2362f;
  --bad-soft: #fbe7e5;
  --band: #f4f6f9;
  --shadow: rgba(6, 28, 82, .08);
  --shadow-2: rgba(6, 28, 82, .14);
  /* exercise tints: background gradient + icon colour */
  --tint-blue: linear-gradient(160deg, #dcebfb, #bcd8f4); --tint-blue-ico: #1f5bd6;
  --tint-steel: linear-gradient(160deg, #dbe4ef, #c3d1e2); --tint-steel-ico: #2f4f78;
  --tint-sand: linear-gradient(160deg, #f1e4d6, #e2cbb4); --tint-sand-ico: #b45d18;
  --tint-lilac: linear-gradient(160deg, #e6e3f5, #d0cbeb); --tint-lilac-ico: #5a539a;
  --tint-mint: linear-gradient(160deg, #dbefe8, #c0e0d4); --tint-mint-ico: #23705c;
  --tint-sky: linear-gradient(160deg, #e2eef8, #c9def0); --tint-sky-ico: #2a6fa8;
  --font-display: 'Wix Madefor Display', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-body: 'Wix Madefor Text', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-sym: 'Segoe UI Symbol', 'Apple Symbols', 'Noto Sans Symbols 2', 'DejaVu Sans', system-ui, sans-serif;
  --t-title: 22px; --t-lead: 18px; --t-body: 15px; --t-small: 13px; --t-meta: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #06080a; --sheet: #11151c; --soft: #1a2029; --rule: #262d38;
    --ink: rgb(244, 246, 250); --ink-2: rgba(244, 246, 250, .7); --ink-3: rgba(244, 246, 250, .45); --muted: rgba(244, 246, 250, .7);
    --accent: #6ea8ff; --accent-strong: #9cc3ff; --accent-ink: #06080a; --accent-soft: #15243d;
    --ok: #5fd39a; --ok-soft: #12291e; --bad: #ff8178; --bad-soft: #33171a; --band: #0c1015;
    --shadow: rgba(0, 0, 0, .4); --shadow-2: rgba(0, 0, 0, .6);
    --tint-blue: linear-gradient(160deg, #18304f, #13253d); --tint-blue-ico: #8dbbff;
    --tint-steel: linear-gradient(160deg, #1f2a38, #18212c); --tint-steel-ico: #a9c0dc;
    --tint-sand: linear-gradient(160deg, #3a2b1d, #2b2017); --tint-sand-ico: #f0b27a;
    --tint-lilac: linear-gradient(160deg, #2a2744, #201e34); --tint-lilac-ico: #bdb6f2;
    --tint-mint: linear-gradient(160deg, #173229, #12271f); --tint-mint-ico: #86d7bd;
    --tint-sky: linear-gradient(160deg, #182c3d, #132331); --tint-sky-ico: #8cc6f2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #06080a; --sheet: #11151c; --soft: #1a2029; --rule: #262d38;
  --ink: rgb(244, 246, 250); --ink-2: rgba(244, 246, 250, .7); --ink-3: rgba(244, 246, 250, .45); --muted: rgba(244, 246, 250, .7);
  --accent: #6ea8ff; --accent-strong: #9cc3ff; --accent-ink: #06080a; --accent-soft: #15243d;
  --ok: #5fd39a; --ok-soft: #12291e; --bad: #ff8178; --bad-soft: #33171a; --band: #0c1015;
  --shadow: rgba(0, 0, 0, .4); --shadow-2: rgba(0, 0, 0, .6);
  --tint-blue: linear-gradient(160deg, #18304f, #13253d); --tint-blue-ico: #8dbbff;
  --tint-steel: linear-gradient(160deg, #1f2a38, #18212c); --tint-steel-ico: #a9c0dc;
  --tint-sand: linear-gradient(160deg, #3a2b1d, #2b2017); --tint-sand-ico: #f0b27a;
  --tint-lilac: linear-gradient(160deg, #2a2744, #201e34); --tint-lilac-ico: #bdb6f2;
  --tint-mint: linear-gradient(160deg, #173229, #12271f); --tint-mint-ico: #86d7bd;
  --tint-sky: linear-gradient(160deg, #182c3d, #132331); --tint-sky-ico: #8cc6f2;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: var(--t-body); line-height: 1.5; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 700; letter-spacing: -.01em; }
.app { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 16px calc(104px + env(safe-area-inset-bottom, 0px)); }

/* ---------- app bar ---------- */
.appbar { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; min-height: 52px; }
.appbar-text { min-width: 0; }
.appbar h1 { margin: 0; font-size: var(--t-title); line-height: 1.2; }
.appbar p { margin: 2px 0 0; color: var(--ink-2); font-size: var(--t-small); line-height: 1.4; text-wrap: pretty; }
.logo-chip { width: 44px; height: 44px; border-radius: 12px; background: var(--tint-blue); display: grid; place-items: center; color: var(--tint-blue-ico); }
.logo-chip svg { width: 26px; height: 26px; }

/* sub-switch inside a tab (Lexikon | Diktat, Sekunden | Terzen) */
.subtabs { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; margin-top: 16px; padding: 4px; border-radius: 12px; background: var(--soft); }
.subtabs[hidden] { display: none; }
.subtab { border: 0; background: none; padding: 9px 10px; border-radius: 9px; font-weight: 700; font-size: 14px; color: var(--ink-2); cursor: pointer; }
.subtab[aria-selected="true"] { background: var(--sheet); color: var(--ink); box-shadow: 0 1px 3px var(--shadow-2); }

/* ---------- bottom navigation ---------- */
.bottomnav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--sheet);
  box-shadow: 0 -1px 0 var(--rule), 0 -10px 30px -18px var(--shadow-2); padding-bottom: env(safe-area-inset-bottom, 0px); }
.bottomnav-in { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px 8px 8px; }
.nav-b { border: 0; background: none; display: grid; justify-items: center; gap: 3px; padding: 6px 2px; border-radius: 12px; cursor: pointer;
  color: var(--ink-3); font-size: var(--t-meta); font-weight: 600; min-width: 0; }
.nav-b svg { width: 24px; height: 24px; display: block; }
.nav-b span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-b:hover { color: var(--ink-2); }
.nav-b[aria-selected="true"] { color: var(--accent); }

/* ---------- start screen ---------- */
.home { display: grid; gap: 0; padding-top: 8px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; margin: 24px 0 12px; }
.sec-h h2 { margin: 0; font-size: var(--t-lead); }
.tiles { display: grid; grid-auto-flow: column; grid-auto-columns: 104px; gap: 12px; overflow-x: auto; scrollbar-width: none; scroll-snap-type: x mandatory; scroll-padding-inline: 16px;
  margin-inline: -16px; padding: 2px 16px 6px; }
.tiles::-webkit-scrollbar { display: none; }
@media (min-width: 720px) { .tiles { grid-auto-flow: row; grid-template-columns: repeat(6, 1fr); margin-inline: 0; padding-inline: 0; } }
.tile { border: 0; height: 132px; border-radius: 16px; display: grid; justify-items: center; align-content: center; gap: 12px; cursor: pointer;
  scroll-snap-align: start; color: var(--ink); font-weight: 600; font-size: 14px; transition: transform .15s; }
.tile:hover { transform: translateY(-2px); }
.tile-ico { width: 48px; height: 48px; border-radius: 12px; background: rgba(255, 255, 255, .75); display: grid; place-items: center; }
:root[data-theme="dark"] .tile-ico { background: rgba(255, 255, 255, .08); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tile-ico { background: rgba(255, 255, 255, .08); } }
.tile-ico svg { width: 26px; height: 26px; }
.t-blue { background: var(--tint-blue); } .t-blue .tile-ico, .t-blue.thumb { color: var(--tint-blue-ico); }
.t-steel { background: var(--tint-steel); } .t-steel .tile-ico, .t-steel.thumb { color: var(--tint-steel-ico); }
.t-sand { background: var(--tint-sand); } .t-sand .tile-ico, .t-sand.thumb { color: var(--tint-sand-ico); }
.t-lilac { background: var(--tint-lilac); } .t-lilac .tile-ico, .t-lilac.thumb { color: var(--tint-lilac-ico); }
.t-mint { background: var(--tint-mint); } .t-mint .tile-ico, .t-mint.thumb { color: var(--tint-mint-ico); }
.t-sky { background: var(--tint-sky); } .t-sky .tile-ico, .t-sky.thumb { color: var(--tint-sky-ico); }

.install { margin-top: 12px; display: grid; grid-template-columns: 48px 1fr auto; align-items: center; gap: 12px 14px; padding: 14px; background: var(--accent-soft); box-shadow: none; position: relative; }
.install-ico { width: 48px; height: 48px; border-radius: 12px; }
.install-txt { padding-right: 24px; }
.install h3 { margin: 0; font-size: var(--t-body); }
.install p { margin: 2px 0 0; font-size: var(--t-small); color: var(--ink-2); line-height: 1.45; }
.install p b { color: var(--ink); }
.install .install-btn { grid-column: 1 / -1; width: 100%; min-height: 48px; }
.guide { margin: 4px 0 0; padding: 0; list-style: none; display: grid; gap: 14px; font-size: 16px; line-height: 1.5; }
.guide-step { display: grid; grid-template-columns: 32px 1fr; gap: 12px; align-items: start; }
.guide-n { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.install-x { position: absolute; top: 8px; right: 8px; background: transparent; box-shadow: none; }
.paper-tip { margin-top: 8px; display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; padding: 14px 16px; background: var(--sheet); }
.paper-ico { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--tint-sand); color: var(--tint-sand-ico); }
.paper-ico svg { width: 20px; height: 20px; }
.paper-tip p { margin: 0; font-size: var(--t-small); line-height: 1.5; color: var(--ink-2); }
.paper-tip b { color: var(--ink); }
/* phones: note keys + Listen + Check form one panel pinned above the tab bar (like a keyboard);
   the notes scroll above it */
@media (max-width: 720px) {
  .panel > .controls { position: sticky; bottom: calc(72px + env(safe-area-inset-bottom, 0px)); z-index: 15; margin: 8px -16px 0; padding: 10px 16px 12px;
    background: var(--bg); box-shadow: 0 -10px 24px -18px var(--shadow-2); border-radius: 18px 18px 0 0; }
  .panel > .controls .btn-big { min-height: 48px; }
  .controls > .dock { grid-column: 1 / -1; border-radius: 14px; background: var(--sheet); box-shadow: 0 1px 2px var(--shadow), inset 0 0 0 1px var(--rule); padding: 8px 10px; gap: 6px 10px; }
  .controls > .dock .dock-name { font-size: 18px; }
  .key { height: 40px; font-size: 17px; }
  .entry { gap: 6px; }
  .entry .icon-btn { height: 38px; min-width: 0; }
  .controls > .dock .palette .pal-b svg { width: 70px; height: auto; }
}
.how-list { margin: 0; padding-left: 22px; display: grid; gap: 10px; font-size: 15px; line-height: 1.5; color: var(--ink-2); }
.how-list b { color: var(--ink); }
.linkish { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 700; cursor: pointer; font-size: inherit; }
.change-rhythm { width: 100%; }
.card { background: var(--sheet); border-radius: 16px; box-shadow: 0 1px 2px var(--shadow), 0 6px 20px -12px var(--shadow-2); }
.circle { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; box-shadow: inset 0 0 0 1.5px var(--rule); color: var(--ink); flex: none; }
.circle svg { width: 16px; height: 16px; }
.list { display: grid; gap: 12px; }
.lcard { display: grid; grid-template-columns: 76px 1fr auto; align-items: center; gap: 14px; padding: 10px 14px 10px 10px; border: 0; width: 100%; text-align: left; cursor: pointer; }
.lcard:hover .circle { background: var(--accent-soft); box-shadow: none; color: var(--accent); }
.thumb { width: 76px; height: 76px; border-radius: 12px; display: grid; place-items: center; }
.thumb svg { width: 34px; height: 34px; }
.lcard h3 { margin: 0; font-size: var(--t-body); line-height: 1.3; }
.lcard p { margin: 4px 0 0; font-size: var(--t-small); color: var(--ink-2); line-height: 1.35; }
.lcard .meta { margin-top: 6px; font-size: var(--t-meta); color: var(--ink-2); display: flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; }
.lcard .meta b { color: var(--ink); }
.star { color: #e7a53a; width: 13px; height: 13px; }

/* ---------- one exercise screen ---------- */
.panel { display: grid; grid-template-columns: minmax(0, 1fr); padding-top: 8px; min-width: 0; }
.panel > * { min-width: 0; }
.info { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.info:empty { display: none; }
.opts { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px 16px; margin-top: 12px; }
.opts:empty { display: none; }
.len { display: flex; align-items: center; gap: 8px; }
.stepper { display: inline-flex; align-items: center; gap: 2px; padding: 3px; border-radius: 12px; background: var(--soft); }
.stepper .seg-b { min-width: 36px; padding: 5px 0; font-size: 17px; line-height: 1; background: var(--sheet); color: var(--ink); box-shadow: 0 1px 2px var(--shadow-2); }
.tempo-val { min-width: 76px; text-align: center; font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; }
/* note-name keypad */
.entry { display: grid; gap: 8px; width: 100%; }
.keypad { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.key { height: 48px; border: 0; border-radius: 12px; background: var(--sheet); color: var(--ink); font-family: var(--font-display); font-weight: 700; font-size: 19px;
  cursor: pointer; box-shadow: 0 1px 2px var(--shadow), inset 0 0 0 1px var(--rule); }
.key:hover { box-shadow: inset 0 0 0 1.5px var(--accent); }
.key:active { background: var(--accent-soft); color: var(--accent); }
.entry .tools { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.entry .icon-btn { width: 100%; }
.icon-btn.oct-btn { display: inline-flex; gap: 2px; align-items: center; justify-content: center; }
.oct-btn svg { width: 16px; height: 16px; }
.oct { font-weight: 700; font-size: 13px; }
.key:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }
.len-lbl { font-size: var(--t-meta); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.seg-sm { padding: 3px; }
.seg-sm .seg-b { padding: 5px 10px; min-width: 34px; font-size: 13px; }
@media (max-width: 520px) { .opts .len { width: 100%; justify-content: space-between; } }
.sheet { margin-top: 16px; }
.controls { margin-top: 16px; }
.feedback { margin-top: 16px; }
.sol-wrap { margin-top: 24px; }

.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 12px; border-radius: 999px; background: var(--sheet); color: var(--ink);
  font-size: var(--t-small); font-weight: 600; font-variant-numeric: tabular-nums; border: 0; box-shadow: 0 1px 2px var(--shadow), inset 0 0 0 1px var(--rule); }
.chip .ico svg { width: 16px; height: 16px; display: block; }
.chip-strong { background: var(--accent-soft); color: var(--accent); box-shadow: none; }
.chip-muted { background: var(--soft); box-shadow: none; color: var(--ink-2); }
.chip-sound { cursor: pointer; }
.chip-sound .ico { color: var(--accent); }
.chip.chip-first { background: var(--accent); color: var(--accent-ink); box-shadow: none; font-size: 14px; }
.chip.chip-first .ico { color: var(--accent-ink); }
.score-svg .ph-plus.ph-first { font: 700 15px var(--font-display); fill: var(--accent); }
.chip-sound:hover { box-shadow: 0 1px 2px var(--shadow), inset 0 0 0 1.5px var(--accent); }
.chip-sound:active { transform: scale(.97); }

.sheet { background: var(--sheet); border-radius: 16px; overflow: hidden; box-shadow: 0 1px 2px var(--shadow), 0 6px 20px -12px var(--shadow-2); }
.sheet > .score { padding: 12px 6px 6px; }
.score { color: var(--ink); min-height: 110px; touch-action: manipulation; outline: none; user-select: none; -webkit-user-select: none; cursor: pointer; }
.score:focus-visible { outline: 2.5px solid var(--accent); outline-offset: -3px; border-radius: 14px; }
.score svg { display: block; overflow: visible; max-width: 100%; height: auto; }
/* the staff scrolls with a swipe; a tap writes, touch-and-hold drags (see bindStaffInput) */
.input-score { touch-action: pan-y; position: relative; }
.drag-zone { position: absolute; touch-action: none; border-radius: 10px; }
.drag-zone[hidden] { display: none; }
.drag-tip { position: fixed; z-index: 50; transform: translateX(-50%); pointer-events: none; padding: 6px 12px; border-radius: 12px;
  background: var(--ink); color: var(--sheet); font-family: var(--font-display); font-weight: 700; font-size: 20px; box-shadow: 0 8px 20px -8px var(--shadow-2); }
.drag-tip[hidden] { display: none; }

/* dock: what you can do right now, inside the sheet */
.dock { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 14px; padding: 12px 14px; background: var(--band); }
.dock[hidden] { display: none; }
.dock-lbl { font-size: var(--t-meta); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.dock-name { font-family: var(--font-display); font-weight: 700; font-size: 20px; line-height: 1; min-width: 2.4em; color: var(--accent); margin-right: auto; }
.dock-hint { font-size: 14px; color: var(--ink-2); margin-right: auto; }
.tools { display: flex; flex-wrap: wrap; gap: 6px; }
.palette { display: flex; flex-wrap: wrap; gap: 6px; width: 100%; }
.pal-b { background: var(--sheet); border: 0; border-radius: 10px; padding: 0 2px; cursor: pointer; color: var(--ink); box-shadow: 0 1px 2px var(--shadow), inset 0 0 0 1px var(--rule); }
.pal-b:hover { box-shadow: inset 0 0 0 2px var(--accent); }
.pal-nota svg, .rc-nota svg { display: block; }

/* things drawn inside the notation */
.score-svg .vf-stave { opacity: .7; }
.score-svg .sel { fill: var(--accent-soft); }
.score-svg .tint-bad { fill: var(--bad-soft); }
.score-svg .band { fill: var(--band); }
.score-svg .sel, .score-svg .tint-bad, .score-svg .band { stroke: none; }
.score-svg .ph-beat { fill: var(--sheet); fill-opacity: .6; stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 4 3; }
.score-svg .ph-beat.on { stroke: var(--accent); stroke-width: 1.4; }
.score-svg .ph-plus { text-anchor: middle; font: 700 17px var(--font-body); fill: var(--ink-3); pointer-events: none; }
.score-svg .ph-plus.on { fill: var(--accent); }
.score-svg .ph-note { fill: none; stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 3 2.5; }
.score-svg .ph-note.on { stroke: var(--accent); stroke-width: 1.6; stroke-dasharray: none; }
.score-svg .preview ellipse { fill: var(--accent); opacity: .5; }
.score-svg .preview line { stroke: var(--accent); stroke-width: 1.1; opacity: .6; }
.score-svg .mnum { font: 700 10px var(--font-body); fill: var(--ink-3); }
.score-svg .col-lbl { text-anchor: middle; font: 700 9.5px var(--font-body); fill: var(--ink-2); letter-spacing: .08em; text-transform: uppercase; }
.score-svg .gb { text-anchor: middle; font: 700 11px var(--font-body); fill: var(--ink); }
.score-svg .lab-base { font: 700 14px var(--font-body); fill: var(--ink); }
.score-svg .lab-fig { font: 700 9.5px var(--font-body); fill: var(--ink); }
.score-svg .lab.fn .lab-base, .score-svg .lab.fn .lab-fig { fill: var(--accent); }
.score-svg .lab-slash { stroke: var(--accent); stroke-width: 1.3; }
.score-svg .row-lbl { font: 700 8.5px var(--font-body); fill: var(--ink-2); letter-spacing: .07em; text-transform: uppercase; }

/* ---------- buttons: one family ---------- */
.controls { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px;
  border-radius: 12px; border: 0; font-weight: 700; font-size: var(--t-body); cursor: pointer; white-space: nowrap; }
.btn .ico svg { width: 18px; height: 18px; display: block; }
.btn[hidden] { display: none; }
