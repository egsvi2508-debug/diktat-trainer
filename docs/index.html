<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Gehörbildung für den Satzlehre-Unterricht: Intervalle, Rhythmus- und Melodiediktat in 6/8, Diktat im Flug und Harmoniefolgen.">
<meta name="theme-color" content="#eceef2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1117" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-64.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Diktat-Trainer">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Satzlehre Diktat-Trainer</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: one centred column. The white "Notenblatt" sheet is the only carded element;
   controls sit beneath it like a music stand. Black = print, blue = your ink, green/red = correction pencil. */
:root {
  --bg: #eceef2;
  --sheet: #ffffff;
  --ink: #161a25;
  --muted: #5b6173;
  --rule: #d6dae3;
  --soft: #e2e5ec;
  --accent: #2443c8;
  --accent-ink: #ffffff;
  --accent-soft: #e2e7fb;
  --ok: #17804a;
  --ok-soft: #ddf1e5;
  --bad: #c0302b;
  --bad-soft: #fbe2df;
  --warn: #8a5a00;
  --warn-soft: #f8eed6;
  --shadow: rgba(20, 26, 44, .22);
  --font-display: 'Young Serif', Georgia, 'Times New Roman', serif;
  --font-body: 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-sym: 'Segoe UI Symbol', 'Apple Symbols', 'Noto Sans Symbols 2', 'DejaVu Sans', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1117; --sheet: #171b24; --ink: #e7eaf3; --muted: #99a0b4; --rule: #2a303e; --soft: #222835;
    --accent: #93a6ff; --accent-ink: #0e1117; --accent-soft: #202a50;
    --ok: #57c98f; --ok-soft: #15301f; --bad: #ff7b71; --bad-soft: #3b1b19; --warn: #f0c062; --warn-soft: #33290f;
    --shadow: rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1117; --sheet: #171b24; --ink: #e7eaf3; --muted: #99a0b4; --rule: #2a303e; --soft: #222835;
  --accent: #93a6ff; --accent-ink: #0e1117; --accent-soft: #202a50;
  --ok: #57c98f; --ok-soft: #15301f; --bad: #ff7b71; --bad-soft: #3b1b19; --warn: #f0c062; --warn-soft: #33290f;
  --shadow: rgba(0, 0, 0, .55);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
button { font: inherit; color: inherit; }
.app { max-width: 1060px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 40px; }

/* ---------- header ---------- */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.logo { width: 46px; height: 46px; flex: none; color: var(--ink); }
.logo .hd { fill: var(--accent); }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 27px; line-height: 1.1; margin: 0; letter-spacing: -.01em; }
.sub { margin: 2px 0 0; color: var(--muted); font-size: 13.5px; }
.gctl { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.vol { display: flex; align-items: center; gap: 6px; color: var(--muted); }
.vol .ico svg { width: 20px; height: 20px; display: block; }
.vol input { width: 96px; accent-color: var(--accent); }

.tabs { display: flex; gap: 2px; margin-top: 18px; border-bottom: 1px solid var(--rule); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { appearance: none; background: none; border: 0; border-bottom: 3px solid transparent; margin-bottom: -1px;
  padding: 10px 12px 10px; display: flex; align-items: baseline; gap: 7px; white-space: nowrap; cursor: pointer;
  color: var(--muted); font-weight: 700; font-size: 14.5px; border-radius: 6px 6px 0 0; }
.tab .n { font-family: var(--font-display); font-weight: 400; font-size: 14px; }
.tab:hover { color: var(--ink); background: var(--soft); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab[aria-selected="true"] .n { color: var(--accent); }

/* ---------- panel ---------- */
.panel { display: grid; gap: 14px; padding-top: 22px; min-width: 0; }
.panel-head { display: flex; gap: 14px; align-items: flex-start; }
.ph-num { font-family: var(--font-display); font-size: 34px; line-height: .95; color: var(--accent); min-width: 1.5em; }
.ph-text { min-width: 0; }
h2 { font-family: var(--font-display); font-weight: 400; font-size: 25px; line-height: 1.15; margin: 0 0 5px; text-wrap: balance; }
.ph-desc { margin: 0; color: var(--muted); max-width: 70ch; }

details.settings > summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
  font-weight: 700; font-size: 14px; color: var(--ink); padding: 6px 12px 6px 10px; border: 1px solid var(--rule); border-radius: 999px; background: var(--sheet); }
details.settings > summary::-webkit-details-marker { display: none; }
details.settings[open] > summary { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
.sum-ico svg { width: 18px; height: 18px; display: block; }
.set-grid { margin-top: 10px; display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px 24px;
  padding: 16px; border: 1px solid var(--rule); border-radius: 12px; background: var(--sheet); }
.field { display: grid; gap: 7px; align-content: start; min-width: 0; }
.field-lbl { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.field-val { text-transform: none; letter-spacing: 0; color: var(--ink); font-variant-numeric: tabular-nums; font-size: 13.5px; }
.field input[type=range] { width: 100%; accent-color: var(--accent); }
.seg { display: inline-flex; flex-wrap: wrap; justify-self: start; border: 1px solid var(--rule); border-radius: 9px; overflow: hidden; background: var(--sheet); }
.seg-b { border: 0; border-right: 1px solid var(--rule); background: none; padding: 7px 12px; font-size: 14px; cursor: pointer; min-width: 38px; }
.seg-b:last-child { border-right: 0; }
.seg-b:hover { background: var(--soft); }
.seg-b[aria-checked="true"] { background: var(--ink); color: var(--sheet); }
.seg-sm .seg-b { padding: 5px 10px; font-size: 13px; font-weight: 700; }
.toggles { display: grid; gap: 9px; }
.toggle { display: flex; align-items: center; gap: 10px; cursor: pointer; position: relative; }
.sw-in { position: absolute; opacity: 0; width: 1px; height: 1px; }
.sw { width: 36px; height: 21px; flex: none; border-radius: 11px; background: var(--rule); position: relative; transition: background .15s; }
.sw::after { content: ''; position: absolute; top: 2.5px; left: 2.5px; width: 16px; height: 16px; border-radius: 50%; background: var(--sheet); box-shadow: 0 1px 2px var(--shadow); transition: transform .15s; }
.sw-in:checked + .sw { background: var(--accent); }
.sw-in:checked + .sw::after { transform: translateX(15px); }
.sw-in:focus-visible + .sw { outline: 2.5px solid var(--accent); outline-offset: 2px; }
.toggle-lbl { font-size: 14.5px; }
.gctl .toggle-lbl { font-size: 13.5px; color: var(--muted); font-weight: 700; }

.taskbar { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 4px 11px; border-radius: 999px; background: var(--soft); font-size: 13.5px; font-variant-numeric: tabular-nums; }
.chip-strong { background: var(--ink); color: var(--sheet); font-weight: 700; }
.chip-muted { background: transparent; box-shadow: inset 0 0 0 1px var(--rule); color: var(--muted); }
.chip-accent { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.chip-ok { background: var(--ok-soft); color: var(--ok); font-weight: 700; }
.chip-bad { background: var(--bad-soft); color: var(--bad); font-weight: 700; }

.sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: 14px; padding: 12px 6px 6px; overflow: hidden;
  box-shadow: 0 1px 0 var(--shadow), 0 14px 30px -22px var(--shadow); }
.score { color: var(--ink); min-height: 110px; touch-action: manipulation; outline: none; user-select: none; -webkit-user-select: none; }
.score:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 4px; border-radius: 8px; }
.score svg { display: block; overflow: visible; }

/* things drawn inside the notation */
.score-svg .vf-stave { opacity: .72; }
.score-svg .sel { fill: var(--accent-soft); opacity: .75; }
.score-svg .tint-bad { fill: var(--bad-soft); }
.score-svg .ph-beat { fill: var(--sheet); fill-opacity: .55; stroke: var(--muted); stroke-width: 1; stroke-dasharray: 4 3; }
.score-svg .ph-beat.on { stroke: var(--accent); stroke-width: 1.4; }
.score-svg .ph-plus { text-anchor: middle; font: 700 17px var(--font-body); fill: var(--muted); pointer-events: none; }
.score-svg .ph-plus.on { fill: var(--accent); }
.score-svg .ph-note { fill: none; stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 2.5; }
.score-svg .ph-note.on { stroke: var(--accent); stroke-width: 1.6; stroke-dasharray: none; }
.score-svg .preview ellipse { fill: var(--accent); opacity: .5; }
.score-svg .preview line { stroke: var(--accent); stroke-width: 1.1; opacity: .6; }
.score-svg .mnum { font: 700 10px var(--font-body); fill: var(--muted); }
.score-svg .col-lbl { text-anchor: middle; font: 700 9.5px var(--font-body); fill: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.score-svg .gb { text-anchor: middle; font: 700 11px var(--font-body); fill: var(--ink); }
.score-svg .lab-base { font: 700 14px var(--font-body); fill: var(--ink); }
.score-svg .lab-fig { font: 700 9.5px var(--font-body); fill: var(--ink); }
.score-svg .lab.fn .lab-base, .score-svg .lab.fn .lab-fig { fill: var(--accent); }
.score-svg .lab-slash { stroke: var(--accent); stroke-width: 1.3; }
.score-svg .row-lbl { font: 700 8.5px var(--font-body); fill: var(--muted); letter-spacing: .07em; text-transform: uppercase; }

/* ---------- controls ---------- */
.controls { display: grid; gap: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { position: relative; overflow: hidden; display: inline-flex; align-items: center; gap: 8px; min-height: 42px; padding: 0 16px;
  border-radius: 10px; border: 1px solid transparent; font-weight: 700; font-size: 15px; cursor: pointer; white-space: nowrap; }
.btn .ico svg { width: 18px; height: 18px; display: block; }
.btn-play { background: var(--accent); color: var(--accent-ink); min-height: 48px; padding: 0 22px; font-size: 16px; }
.btn-play .ico svg { width: 20px; height: 20px; }
.btn-ink { background: var(--ink); color: var(--sheet); }
.btn-sec { background: var(--sheet); color: var(--ink); border-color: var(--rule); }
.btn-sec:hover { border-color: var(--muted); }
.btn-play:hover, .btn-ink:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .42; cursor: default; filter: none; }
.btn .prog { position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: currentColor; opacity: .6; }
.btn.is-playing .prog { transition: width .08s linear; }
.btn:focus-visible, .tb:focus-visible, .seg-b:focus-visible, .tab:focus-visible, .pal-b:focus-visible, summary:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }
.actions { padding-top: 2px; }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; }
.toolbar[hidden] { display: none; }
.tb-group { display: inline-flex; border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; background: var(--sheet); }
.tb { width: 46px; height: 44px; display: grid; place-items: center; border: 0; border-right: 1px solid var(--rule); background: none; cursor: pointer; padding: 0; }
.tb:last-child { border-right: 0; }
.tb:hover { background: var(--soft); }
.tb:active { background: var(--accent-soft); }
.tb svg { width: 21px; height: 21px; display: block; }
.tb .acc { font-family: var(--font-sym); font-size: 20px; line-height: 1; }
.tb-acc:nth-child(1) .acc, .tb-acc:nth-child(5) .acc { font-size: 17px; }
.tb-small { width: 34px; height: 34px; border: 1px solid var(--rule); border-radius: 8px; flex: none; }
.tb-small:last-child { border-right: 1px solid var(--rule); }
.tb-small svg { width: 16px; height: 16px; }
.keyhelp { margin: -4px 0 0; font-size: 12.5px; color: var(--muted); }
@media (hover: none) { .keyhelp { display: none; } }

.feedback { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; font-size: 15px; line-height: 1.45; margin: 0; }
.feedback b { font-variant-numeric: tabular-nums; }
.fb-ico svg { width: 22px; height: 22px; display: block; flex: none; }
.fb-ok { background: var(--ok-soft); } .fb-ok .fb-ico { color: var(--ok); }
.fb-bad { background: var(--bad-soft); } .fb-bad .fb-ico { color: var(--bad); }
.fb-info { background: var(--accent-soft); } .fb-info .fb-ico { color: var(--accent); }
.stats { margin: 0; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tip { display: flex; gap: 10px; align-items: flex-start; margin: 0; padding: 10px 13px; border-radius: 12px; background: var(--warn-soft); font-size: 14px; max-width: 80ch; }
.tip-ico { color: var(--warn); } .tip-ico svg { width: 21px; height: 21px; display: block; }
.sol-wrap { display: grid; gap: 8px; }
.sol-wrap[hidden] { display: none; }
.sol-h { font-family: var(--font-display); font-weight: 400; font-size: 19px; margin: 6px 0 0; }

/* palette (melody dictation) */
.pal-wrap { display: grid; gap: 7px; }
.pal-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px 14px; }
.pal-head .toggle-lbl { font-size: 13.5px; color: var(--muted); }
.palette { display: flex; flex-wrap: wrap; gap: 6px; }
.palette.dim { opacity: .45; pointer-events: none; }
.pal-b { background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; padding: 1px 3px; cursor: pointer; color: var(--ink); }
.pal-b:hover { border-color: var(--accent); background: var(--accent-soft); }
.pal-nota svg, .rc-nota svg { display: block; }

/* lexicon */
.lex-bar { gap: 8px 10px; }
.lex-count { color: var(--muted); font-size: 13.5px; font-variant-numeric: tabular-nums; }
.spacer { flex: 1 1 0; }
.lex-tempo .field { width: min(320px, 100%); }
.quizbar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--accent-soft);
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; box-shadow: 0 8px 20px -16px var(--shadow); }
.quizbar[hidden] { display: none; }
.qz-q { font-weight: 700; }
.lex-groups { display: grid; gap: 20px; }
.lex-sec h3 { font-family: var(--font-display); font-weight: 400; font-size: 18px; margin: 0 0 9px; display: flex; align-items: baseline; gap: 8px; }
.lex-sec-n { font-family: var(--font-body); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.lex-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(164px, 1fr)); gap: 10px; }
.rcard { background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; padding: 8px 10px 10px; display: grid; gap: 7px; align-content: start;
  transition: border-color .15s, box-shadow .15s, opacity .15s; min-width: 0; }
.rcard.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.rc-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; }
.rc-nota { color: var(--ink); min-height: 58px; }
.rc-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; }
.rc-grid span { height: 6px; border-radius: 2px; background: var(--soft); }
.rc-grid .on { background: var(--ink); }
.rc-grid .hold { background: var(--accent-soft); }
.rc-name { display: flex; align-items: baseline; gap: 6px; font-size: 12.5px; line-height: 1.3; }
.rc-use { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--muted); cursor: pointer; }
.rc-use input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
.tier-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.tier-dot.t0 { background: var(--accent); }
.tier-dot.t1 { background: var(--muted); }
.tier-dot.t2 { box-shadow: inset 0 0 0 1.5px var(--muted); }
.legend { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: 0; font-size: 12.5px; color: var(--muted); }
.legend .tier-dot { margin-left: 6px; }
.quizzing .rcard { cursor: pointer; }
.quizzing .rcard:not(.on) { opacity: .35; }
.quizzing .rcard.on:hover { border-color: var(--ink); }
.rcard.qa-ok { border-color: var(--ok); box-shadow: inset 0 0 0 2px var(--ok); background: var(--ok-soft); opacity: 1; }
.rcard.qa-bad { border-color: var(--bad); box-shadow: inset 0 0 0 2px var(--bad); background: var(--bad-soft); }

footer { margin-top: 40px; padding-top: 14px; border-top: 1px solid var(--rule); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; color: var(--muted); font-size: 13px; }
footer p { margin: 0; max-width: 72ch; }
.linkbtn { background: none; border: 0; padding: 4px 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: 13px; }
.linkbtn:hover { color: var(--ink); }

@media (max-width: 560px) {
  h1 { font-size: 23px; }
  h2 { font-size: 21px; }
  .ph-num { font-size: 26px; }
  .btn { padding: 0 13px; font-size: 14.5px; }
  .btn-play { padding: 0 18px; }
  .tb { width: 42px; }
  .lex-grid { grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="top">
      <div class="brand">
        <svg class="logo" viewBox="0 0 48 48" aria-hidden="true">
          <g stroke="currentColor" stroke-width="1.6" opacity=".75"><path d="M3 14h42M3 20h42M3 26h42M3 32h42M3 38h42"/></g>
          <ellipse class="hd" cx="18" cy="29" rx="6.2" ry="4.6" transform="rotate(-22 18 29)"/>
          <path d="M23.6 27.4V6.5c4.5 1.6 9.6 4.2 10.4 9.8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          <ellipse cx="35" cy="17" rx="5" ry="3.7" transform="rotate(-22 35 17)" fill="none" stroke="currentColor" stroke-width="1.8"/>
        </svg>
        <div>
          <h1 data-i18n="appTitle">Diktat-Trainer</h1>
          <p class="sub" data-i18n="appSub">Gehörbildung für den Satzlehre-Unterricht</p>
        </div>
      </div>
      <div class="gctl" id="gctl"></div>
    </div>
    <nav class="tabs" role="tablist" id="tabs" aria-label="Übungen"></nav>
  </header>
  <main id="panels"></main>
  <footer>
    <p data-i18n="footer">Inoffizielles Übungstool für den Satzlehre-Unterricht.</p>
    <button type="button" class="linkbtn" id="reset-stats" data-i18n="resetStats">Statistik zurücksetzen</button>
  </footer>
</div>
<script src="vendor/vexflow.js"></script>
<script src="js/i18n.js"></script>
<script src="js/core.js"></script>
<script src="js/notation.js"></script>
<script src="js/audio.js"></script>
<script src="js/ui.js"></script>
<script src="js/ex-intervals.js"></script>
<script src="js/ex-rhythm.js"></script>
<script src="js/ex-flight.js"></script>
<script src="js/ex-harmony.js"></script>
<script src="js/app.js"></script>
<script>if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body>
</html>
